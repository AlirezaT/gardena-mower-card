<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mower animation preview</title>
<style>body{margin:28px;background:#101a15;color:#e8eee9;font:14px system-ui;--primary-text-color:#e8eee9;--secondary-text-color:#9aaa9e;--secondary-background-color:#26382d;--card-background-color:#18281f;--divider-color:#344e3d}main{max-width:420px;margin:auto}label{display:inline-block;margin:0 10px 16px 0}select{padding:8px;background:#26382d;color:inherit;border:1px solid #48614f;border-radius:8px}ha-card{display:block}h1{font-size:21px}p{color:#9aaa9e;font-size:12px}</style>
<main><h1>Mower animation preview · demo</h1><p>Simulated states. This preview never connects to or controls your mower.</p><label>Activity <select id="activity"><option>parked</option><option>charging</option><option>mowing</option><option>spot</option><option>returning</option><option>paused</option><option>error</option><option>unavailable</option></select></label><label><input type="checkbox" id="garage" checked> Garage</label><label><input type="checkbox" id="motion" checked> Animate</label><gardena-mower-card></gardena-mower-card></main>
<script type="module">
import '../dist/gardena-mower-card.js';
const card=document.querySelector('gardena-mower-card');
window.card=card;
const demoEntities={"permanentPark": "switch.demo_permanentpark", "schedule": "calendar.demo_schedule", "ManualMowingDuration": "number.demo_manualmowingduration", "EcoMode": "switch.demo_ecomode", "SensorControlEnabled": "switch.demo_sensorcontrolenabled", "SensorControlSensitivity": "select.demo_sensorcontrolsensitivity", "FrostSensorEnabled": "switch.demo_frostsensorenabled", "GarageEnabled": "switch.demo_garageenabled", "ZoneProtectEnabled": "switch.demo_zoneprotectenabled", "DrivePastWire": "number.demo_drivepastwire", "ReversingDistance": "number.demo_reversingdistance", "StartingPoint1Enabled": "switch.demo_startingpoint1enabled", "StartingPoint1Distance": "number.demo_startingpoint1distance", "StartingPoint1Proportion": "number.demo_startingpoint1proportion", "modelName": "sensor.demo_modelname", "serialNumber": "sensor.demo_serialnumber", "softwarePackageVersion": "sensor.demo_softwarepackageversion", "mode": "sensor.demo_mode", "batteryTemperature": "sensor.demo_batterytemperature", "cuttingBladeUsageTime": "sensor.demo_cuttingbladeusagetime", "totalCuttingTime": "sensor.demo_totalcuttingtime", "numberOfChargingCycles": "sensor.demo_numberofchargingcycles", "loopSignalStrength": "sensor.demo_loopsignalstrength", "errorDescription": "sensor.demo_errordescription", "last_message": "sensor.demo_last_message", "diagnostic_refresh": "button.demo_diagnostic_refresh"};
const demoStates={"switch.demo_permanentpark": {"entity_id": "switch.demo_permanentpark", "state": "on", "attributes": {}}, "calendar.demo_schedule": {"entity_id": "calendar.demo_schedule", "state": "off", "attributes": {"friendly_name": "Demo mower schedule", "schedule_count": 2, "schedules": ["09:00-11:00 on Monday, Wednesday, Friday", "10:00-12:00 on Saturday"]}}, "number.demo_manualmowingduration": {"entity_id": "number.demo_manualmowingduration", "state": "3", "attributes": {"min": 0.5, "max": 24, "step": 0.5, "unit_of_measurement": "h"}}, "switch.demo_ecomode": {"entity_id": "switch.demo_ecomode", "state": "off", "attributes": {}}, "switch.demo_sensorcontrolenabled": {"entity_id": "switch.demo_sensorcontrolenabled", "state": "off", "attributes": {}}, "select.demo_sensorcontrolsensitivity": {"entity_id": "select.demo_sensorcontrolsensitivity", "state": "Medium", "attributes": {"options": ["Low", "Medium", "High"]}}, "switch.demo_frostsensorenabled": {"entity_id": "switch.demo_frostsensorenabled", "state": "on", "attributes": {}}, "switch.demo_garageenabled": {"entity_id": "switch.demo_garageenabled", "state": "on", "attributes": {}}, "switch.demo_zoneprotectenabled": {"entity_id": "switch.demo_zoneprotectenabled", "state": "off", "attributes": {}}, "number.demo_drivepastwire": {"entity_id": "number.demo_drivepastwire", "state": "35", "attributes": {"unit_of_measurement": "cm"}}, "number.demo_reversingdistance": {"entity_id": "number.demo_reversingdistance", "state": "100", "attributes": {"unit_of_measurement": "cm"}}, "switch.demo_startingpoint1enabled": {"entity_id": "switch.demo_startingpoint1enabled", "state": "on", "attributes": {}}, "number.demo_startingpoint1distance": {"entity_id": "number.demo_startingpoint1distance", "state": "17", "attributes": {"unit_of_measurement": "m"}}, "number.demo_startingpoint1proportion": {"entity_id": "number.demo_startingpoint1proportion", "state": "68", "attributes": {"unit_of_measurement": "%"}}, "sensor.demo_modelname": {"entity_id": "sensor.demo_modelname", "state": "SILENO Minimo 250", "attributes": {}}, "sensor.demo_serialnumber": {"entity_id": "sensor.demo_serialnumber", "state": "DEMO", "attributes": {}}, "sensor.demo_softwarepackageversion": {"entity_id": "sensor.demo_softwarepackageversion", "state": "Demo firmware", "attributes": {}}, "sensor.demo_mode": {"entity_id": "sensor.demo_mode", "state": "home", "attributes": {}}, "sensor.demo_batterytemperature": {"entity_id": "sensor.demo_batterytemperature", "state": "20", "attributes": {"unit_of_measurement": "\u00b0C"}}, "sensor.demo_cuttingbladeusagetime": {"entity_id": "sensor.demo_cuttingbladeusagetime", "state": "4.4", "attributes": {"unit_of_measurement": "h"}}, "sensor.demo_totalcuttingtime": {"entity_id": "sensor.demo_totalcuttingtime", "state": "220", "attributes": {"unit_of_measurement": "h"}}, "sensor.demo_numberofchargingcycles": {"entity_id": "sensor.demo_numberofchargingcycles", "state": "142", "attributes": {}}, "sensor.demo_loopsignalstrength": {"entity_id": "sensor.demo_loopsignalstrength", "state": "100", "attributes": {"unit_of_measurement": "%"}}, "sensor.demo_errordescription": {"entity_id": "sensor.demo_errordescription", "state": "No error", "attributes": {}}, "sensor.demo_last_message": {"entity_id": "sensor.demo_last_message", "state": "No recent messages", "attributes": {}}, "button.demo_diagnostic_refresh": {"entity_id": "button.demo_diagnostic_refresh", "state": "unknown", "attributes": {}}};
card.openCalendar=()=>{card.message="The dashboard opens Home Assistant’s calendar editor here.";card.render();};
card.addEventListener("hass-more-info",e=>{card.message="Preview: this opens the entity’s settings and history in Home Assistant.";card.render();});
window.updatePreview=()=>{
 const activity=document.querySelector('#activity').value;
 demoEntities['switch:spotCutting']='switch.demo_spot'; demoEntities.StartingPointChargingStationProportion='sensor.demo_station_share';
 card.setConfig({entity:'lawn_mower.preview',model:'SILENO Minimo 250',name:'Garden mower',garage:document.querySelector('#garage').checked,animation:document.querySelector('#motion').checked,entities:{...demoEntities,activity:'sensor.activity',spotCutting:'sensor.spot',battery_level:'sensor.battery'}});
 demoEntities['switch:spotCutting']='switch.demo_spot'; demoStates['switch.demo_spot']={entity_id:'switch.demo_spot',state:'off',attributes:{}}; demoEntities.StartingPointChargingStationProportion='sensor.demo_station_share'; demoStates['sensor.demo_station_share']={entity_id:'sensor.demo_station_share',state:'32',attributes:{unit_of_measurement:'%'}};
 const state=({parked:'docked',charging:'docked',spot:'mowing'})[activity]||activity;
 card.hass={callService:async(domain,service,data)=>{const entity=demoStates[data.entity_id];if(entity) { entity.state=domain==='switch'?(service==='turn_on'?'on':'off'):String(data.option ?? data.value ?? entity.state); }},states:{...demoStates,'lawn_mower.preview':{state,attributes:{supported_features:7}},'sensor.activity':{state:activity==='returning'?'going_home':activity,attributes:{}},'sensor.spot':{state:activity==='spot'?'running':'idle',attributes:{}},'sensor.battery':{state:'76',attributes:{}}}};
};
document.querySelectorAll('select,input').forEach(e=>e.addEventListener('change',window.updatePreview));window.updatePreview();
</script></html>
